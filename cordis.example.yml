# Example DeepSeek Harness / Cordis composition enabling TM IM.
# Save as cordis.yml next to your harness deployment and adjust values.
- name: '@tmim/dsh-plugin-tmim'
  config:
    baseUrl: 'https://tmim.example.com'
    credential:
      kind: 'apikey'
      token: 'tm_xxxxxxxxxxxxxxxx'      # Agent takeover api_key
    deviceId: 'dsh-harness-1'
    agent:
      provider: 'deepseek-official'
      model: 'deepseek-chat'
    cwd: './'
    tools: true
    enableAgentTakeover: true
    # Inbound: WebSocket long-connection (recommended, no public HTTPS needed).
    ws:
      enabled: true
      # url: 'wss://tmim.example.com/ws'   # optional; defaults to baseUrl host
    # Alternative inbound: webhook (requires public HTTPS + one-time secret)
    # webhook:
    #   enabled: true
    #   path: '/tm/callback'
    #   secret: 'whsec_3a7f9c2e5b8d1046'
